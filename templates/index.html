<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
</head>
<body>
    <h1>Emotion Detector</h1>
    <label for="textToAnalyze">Enter text to analyze:</label>
    <input type="text" id="textToAnalyze" name="textToAnalyze">
    <button onclick="detectEmotion()">Analyze Emotion</button>
    <p id="system_response"></p>

    <script>
        function detectEmotion() {
            var text = document.getElementById('textToAnalyze').value;
            fetch('/emotionDetector?textToAnalyze=' + encodeURIComponent(text))
                .then(response => response.text())
                .then(data => {
                    document.getElementById('system_response').innerText = data;
                })
                .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
